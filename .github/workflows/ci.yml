name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23','1.24','1.25']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install ipset
      run: |
        sudo apt-get update
        sudo apt-get install -y ipset

    - name: Set up test ipsets
      run: sudo bash scripts/setup-test-ipsets.sh

    - name: Install libcap2-bin for setcap
      run: sudo apt-get install -y libcap2-bin

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    # The test binary is built in $RUNNER_TEMP instead of /tmp: on newer Ubuntu runner images
    # /tmp is a tmpfs mounted with nosuid, and the kernel ignores file capabilities on nosuid mounts.
    - name: Build test binary
      run: |
        findmnt -T /tmp -o TARGET,FSTYPE,OPTIONS || true
        findmnt -T "$RUNNER_TEMP" -o TARGET,FSTYPE,OPTIONS || true
        go test -c -race -cover -o "$RUNNER_TEMP/caddy-ipset.test"

    # CADDY_IPSET_EXPECT_CAP_MODE makes the tests fail instead of skip when the capability is missing
    - name: Run tests with cap_net_admin=+ep
      run: |
        sudo setcap cap_net_admin=+ep "$RUNNER_TEMP/caddy-ipset.test"
        getcap "$RUNNER_TEMP/caddy-ipset.test"
        CADDY_IPSET_EXPECT_CAP_MODE=effective "$RUNNER_TEMP/caddy-ipset.test" -test.v -test.coverprofile=coverage-effective.out

    - name: Run tests with cap_net_admin=+p
      run: |
        sudo setcap cap_net_admin=+p "$RUNNER_TEMP/caddy-ipset.test"
        getcap "$RUNNER_TEMP/caddy-ipset.test"
        CADDY_IPSET_EXPECT_CAP_MODE=raise "$RUNNER_TEMP/caddy-ipset.test" -test.v -test.coverprofile=coverage-raise.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi
